name: Integridad del repositorio (sin microdatos)

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Revisar sintaxis, notebooks y archivos prohibidos
        run: python scripts/validar_publicacion.py
